<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pulse — Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --off-white: #f4f0e8;
      --accent: #ff3d00;
      --muted: #888;
      --border: rgba(244,240,232,0.12);
      --input-bg: rgba(255,255,255,0.04);
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--off-white);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 100;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
    }

    .left {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      overflow: hidden;
      background: #0e0e0e;
      border-right: 1px solid var(--border);
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .bg-circle-1 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(255,61,0,0.18) 0%, transparent 70%);
      top: -100px; left: -120px;
      animation: drift1 8s ease-in-out infinite alternate;
    }
    .bg-circle-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,200,50,0.08) 0%, transparent 70%);
      bottom: 60px; right: -80px;
      animation: drift2 10s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(30px, 40px); } }
    @keyframes drift2 { to { transform: translate(-20px, -30px); } }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.12em;
      color: var(--off-white);
      position: relative;
      z-index: 1;
    }
    .logo span { color: var(--accent); }

    .hero-text {
      position: relative;
      z-index: 1;
    }
    .hero-text h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 7vw, 7rem);
      line-height: 0.92;
      letter-spacing: 0.03em;
      color: var(--off-white);
      text-transform: uppercase;
    }
    .hero-text h1 em {
      font-style: normal;
      color: var(--accent);
      display: block;
    }
    .hero-text p {
      margin-top: 24px;
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.65;
    }

    .stat-row {
      display: flex;
      gap: 40px;
      position: relative;
      z-index: 1;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.04em;
      color: var(--off-white);
    }
    .stat-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow-y: auto;
    }

    .form-card {
      width: 100%;
      max-width: 400px;
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-header { margin-bottom: 36px; }
    .form-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      letter-spacing: 0.06em;
      color: var(--off-white);
    }
    .form-header p { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
    .form-header p a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .form-header p a:hover { text-decoration: underline; }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }

    label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--off-white);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input::placeholder { color: #444; }
    input:focus {
      border-color: var(--accent);
      background: rgba(255,61,0,0.05);
    }

    .password-wrap { position: relative; }
    .password-wrap input { width: 100%; padding-right: 44px; }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 0;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--off-white); }

    .strength-bar {
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s, background 0.4s;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 24px;
      margin-top: 4px;
    }
    .terms input[type="checkbox"] {
      accent-color: var(--accent);
      margin-top: 2px;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .terms span { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .terms a { color: var(--off-white); text-decoration: underline; text-underline-offset: 2px; }

    .btn-signup {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn-signup::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-signup:hover { background: #e63500; }
    .btn-signup:hover::after { opacity: 1; }
    .btn-signup:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .social-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: var(--off-white);
      transition: border-color 0.2s, background 0.2s;
      font-weight: 400;
    }
    .social-btn:hover {
      border-color: rgba(244,240,232,0.3);
      background: rgba(255,255,255,0.07);
    }
    .social-btn svg { flex-shrink: 0; }

    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; }
      .left { display: none; }
      .right { padding: 32px 24px; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- LEFT BRAND PANEL -->
  <div class="left">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <div class="logo">Puls<span>e</span></div>

    <div class="hero-text">
      <h1>Share<em>Your</em>World.</h1>
      <p>Connect with creators, discover communities, and build your presence — all in one place.</p>
    </div>

    <div class="stat-row">
      <div class="stat">
        <span class="stat-num">4.2M</span>
        <span class="stat-label">Active Users</span>
      </div>
      <div class="stat">
        <span class="stat-num">180+</span>
        <span class="stat-label">Countries</span>
      </div>
      <div class="stat">
        <span class="stat-num">98M</span>
        <span class="stat-label">Posts/Day</span>
      </div>
    </div>
  </div>

  <!-- RIGHT FORM PANEL -->
  <div class="right">
    <div class="form-card">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Already have one? <a href="#">Sign in</a></p>
      </div>

      <div class="name-row">
        <div class="field">
          <label for="fname">First Name</label>
          <input type="text" id="fname" placeholder="Alex" autocomplete="given-name"/>
        </div>
        <div class="field">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" placeholder="Rivera" autocomplete="family-name"/>
        </div>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="@yourhandle" autocomplete="username"/>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="8+ characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button class="toggle-pw" type="button" onclick="togglePw()" aria-label="Show/hide password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      </div>

      <div class="terms">
        <input type="checkbox" id="agree"/>
        <span>I agree to Pulse's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </div>
<a href ="Interests.png">
      <button class="btn-signup" onclick="handleSignup()">Create My Account</button>
</a>
      <div class="divider"><span>or continue with</span></div>

      <div class="social-btns">
        <button class="social-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }

  function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#ff3d00','#ff9100','#ffcc00','#00e676'];
    const widths = ['20%','45%','70%','100%'];
    if (val.length === 0) { fill.style.width = '0'; return; }
    fill.style.width = widths[score - 1] || '20%';
    fill.style.background = colors[score - 1] || colors[0];
  }

  function handleSignup() {
    const fname = document.getElementById('fname').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const agreed = document.getElementById('agree').checked;
    if (!fname || !email || !pw) { alert('Please fill in all required fields.'); return; }
    if (!agreed) { alert('Please accept the Terms of Service to continue.'); return; }
    alert(`Welcome to Pulse, ${fname}! 🎉`);
  }
</script>
</body>
</html>
