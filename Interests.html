<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyFuoye — Your Interests</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --black:#050a00;--dark:#0d1500;--card:#0f1800;
      --green:#39e600;--green2:#27a800;--gold:#f0c000;--gold2:#c99a00;
      --muted:#6a8050;--border:rgba(57,230,0,0.14);--white:#f0ffe0;
    }
    html,body{min-height:100%;background:var(--black);color:var(--white);font-family:'Nunito',sans-serif}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(57,230,0,0.07),transparent 65%);pointer-events:none;z-index:0}

    /* TOP NAV */
    nav{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 40px;background:rgba(5,10,0,0.92);
      border-bottom:1px solid var(--border);backdrop-filter:blur(12px);
    }
    nav img{height:44px;object-fit:contain}
    .step-row{display:flex;align-items:center;gap:6px}
    .step{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .step.done{color:var(--green)}
    .step.active{color:var(--gold)}
    .step-dot{width:28px;height:4px;border-radius:2px;background:rgba(57,230,0,0.12);transition:background .4s}
    .step-dot.done{background:var(--green)}
    .step-dot.active{background:var(--gold)}
    .step-sep{color:var(--border);margin:0 2px}

    /* MAIN */
    main{position:relative;z-index:1;padding:48px 40px;max-width:820px;margin:0 auto}
    .page-title{font-family:'Oswald',sans-serif;font-size:2.4rem;text-transform:uppercase;letter-spacing:.04em;color:var(--white)}
    .page-title span{color:var(--green)}
    .page-sub{color:var(--muted);font-size:.9rem;margin-top:8px;margin-bottom:32px}

    /* SEARCH */
    .search-wrap{position:relative;margin-bottom:28px}
    .search-wrap input{
      width:100%;padding:13px 16px 13px 46px;background:rgba(57,230,0,0.04);
      border:1px solid var(--border);border-radius:10px;font-size:.92rem;
      font-family:'Nunito',sans-serif;color:var(--white);outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .search-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(57,230,0,0.1)}
    .search-wrap input::placeholder{color:#3a4a30}
    .search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

    /* CATEGORY TABS */
    .cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .cat-tab{
      padding:6px 16px;border-radius:999px;font-size:.76rem;font-weight:800;
      letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;
      background:rgba(57,230,0,0.06);color:var(--muted);border:1px solid var(--border);
    }
    .cat-tab:hover{border-color:rgba(57,230,0,0.35);color:var(--white)}
    .cat-tab.active{background:var(--green);color:#050a00;border-color:var(--green)}

    /* GRID */
    .interests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
    .int-card{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:11px;padding:22px 14px;background:var(--card);
      border:2px solid var(--border);border-radius:14px;cursor:pointer;
      transition:all .22s;text-align:center;user-select:none;
    }
    .int-card:hover{border-color:rgba(57,230,0,0.4);background:rgba(57,230,0,0.05);transform:translateY(-2px)}
    .int-card.selected{border-color:var(--green);background:rgba(57,230,0,0.1);box-shadow:0 0 0 1px var(--green),0 4px 20px rgba(57,230,0,0.15)}
    .int-card.selected .i-icon{transform:scale(1.15)}
    .i-icon{font-size:2.1rem;transition:transform .25s}
    .i-label{font-size:.75rem;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;transition:color .2s}
    .int-card.selected .i-label{color:var(--green)}
    .i-count{font-size:.68rem;color:var(--muted);margin-top:-4px}

    /* FLOATING BOTTOM BAR */
    .bottom-bar{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 40px;background:rgba(5,10,0,0.95);
      border-top:1px solid var(--border);backdrop-filter:blur(12px);
    }
    .sel-info{font-size:.85rem;color:var(--muted);font-weight:700}
    .sel-info span{color:var(--green);font-size:1.1rem}
    .bar-btns{display:flex;gap:12px}
    .btn-skip{background:none;border:1px solid var(--border);border-radius:8px;padding:10px 22px;color:var(--muted);cursor:pointer;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;transition:all .2s}
    .btn-skip:hover{border-color:rgba(57,230,0,0.3);color:var(--white)}
    .btn-next{
      padding:11px 28px;background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#050a00;border:none;border-radius:8px;cursor:pointer;
      font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:.08em;
      font-weight:600;transition:opacity .2s,box-shadow .2s;
    }
    .btn-next:hover{opacity:.9;box-shadow:0 4px 18px rgba(240,192,0,0.35)}
    .btn-next:disabled{opacity:.35;cursor:not-allowed}

    /* space for fixed bar */
    .bar-spacer{height:80px}

    @media(max-width:600px){
      nav{padding:12px 20px}
      main{padding:32px 20px}
      .bottom-bar{padding:14px 20px}
      .interests-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    }
  </style>
</head>
<body>
<nav>
  <img src="MyFuoyeLogo.png" alt="MyFuoye"/>
  <div class="step-row">
    <div class="step done">✓ Account</div>
    <span class="step-sep">›</span>
    <div class="step active">Interests</div>
    <span class="step-sep">›</span>
    <div class="step">Follow</div>
  </div>
</nav>

<main>
  <div class="page-title">Pick Your <span>Interests</span></div>
  <div class="page-sub">Choose at least 3 topics — we'll personalise your feed around what matters to you.</div>

  <div class="search-wrap">
    <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-inp" placeholder="Search interests..." oninput="filterInterests()"/>
  </div>

  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="interests-grid" id="interests-grid"></div>
  <div class="bar-spacer"></div>
</main>

<div class="bottom-bar">
  <div class="sel-info"><span id="sel-n">0</span> of 3+ selected</div>
  <div class="bar-btns">
    <button class="btn-skip" onclick="window.location.href='follow.html'">Skip</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" disabled><a href="Follow.html">Continue →</a></button>
  </div>
</div>

<script>
  const interests = [
    {icon:'💻',label:'Technology',cat:'Academic',count:'12.4k'},
    {icon:'📐',label:'Engineering',cat:'Academic',count:'9.1k'},
    {icon:'🧬',label:'Sciences',cat:'Academic',count:'8.3k'},
    {icon:'📖',label:'Literature',cat:'Academic',count:'5.2k'},
    {icon:'🧮',label:'Mathematics',cat:'Academic',count:'7.6k'},
    {icon:'🏥',label:'Medicine',cat:'Academic',count:'6.8k'},
    {icon:'⚖️',label:'Law',cat:'Academic',count:'4.9k'},
    {icon:'📊',label:'Business',cat:'Academic',count:'10.1k'},
    {icon:'🌍',label:'Geography',cat:'Academic',count:'3.4k'},
    {icon:'🔭',label:'Research',cat:'Academic',count:'5.7k'},
    {icon:'🎨',label:'Arts & Design',cat:'Creative',count:'8.8k'},
    {icon:'🎵',label:'Music',cat:'Creative',count:'11.2k'},
    {icon:'📸',label:'Photography',cat:'Creative',count:'9.6k'},
    {icon:'✍️',label:'Writing',cat:'Creative',count:'6.3k'},
    {icon:'🎬',label:'Film & Media',cat:'Creative',count:'7.4k'},
    {icon:'🏋️',label:'Sports',cat:'Lifestyle',count:'14.1k'},
    {icon:'🍳',label:'Food & Cooking',cat:'Lifestyle',count:'10.8k'},
    {icon:'🧘',label:'Wellness',cat:'Lifestyle',count:'6.1k'},
    {icon:'✈️',label:'Travel',cat:'Lifestyle',count:'8.5k'},
    {icon:'💡',label:'Innovation',cat:'Campus',count:'5.9k'},
    {icon:'🤝',label:'Community',cat:'Campus',count:'7.2k'},
    {icon:'🏆',label:'Competitions',cat:'Campus',count:'4.3k'},
    {icon:'🎓',label:'Scholarships',cat:'Campus',count:'9.0k'},
    {icon:'📢',label:'Campus News',cat:'Campus',count:'15.7k'},
  ];

  const cats = ['All', ...new Set(interests.map(i=>i.cat))];
  let activeCat = 'All';
  let selected = new Set();
  let query = '';

  // Build category tabs
  const catEl = document.getElementById('cat-tabs');
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (c==='All'?' active':'');
    btn.textContent = c;
    btn.onclick = () => {
      activeCat = c;
      document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    };
    catEl.appendChild(btn);
  });

  function renderGrid() {
    const grid = document.getElementById('interests-grid');
    grid.innerHTML = '';
    const filtered = interests.filter(i =>
      (activeCat === 'All' || i.cat === activeCat) &&
      i.label.toLowerCase().includes(query.toLowerCase())
    );
    filtered.forEach((it, idx) => {
      const el = document.createElement('div');
      el.className = 'int-card' + (selected.has(it.label) ? ' selected' : '');
      el.innerHTML = `<span class="i-icon">${it.icon}</span><span class="i-label">${it.label}</span><span class="i-count">${it.count} followers</span>`;
      el.onclick = () => {
        if (selected.has(it.label)) selected.delete(it.label);
        else selected.add(it.label);
        el.classList.toggle('selected');
        document.getElementById('sel-n').textContent = selected.size;
        document.getElementById('btn-next').disabled = selected.size < 3;
      };
      grid.appendChild(el);
    });
  }

  function filterInterests() {
    query = document.getElementById('search-inp').value;
    renderGrid();
  }

  function goNext() {
    sessionStorage.setItem('interests', JSON.stringify([...selected]));
    window.location.href = 'follow.html';
  }

  renderGrid();
</script>
</body>
</html>
